[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llamafactory"
version = "0.9.2.dev0"
description = "Local LLaMAFactory fork used by the SSPO, StaticPE and FrozenPE research prototypes"
readme = "README.md"
# Keep the package's actual lower bound. The Round4 environment separately pins CPython 3.12.x.
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
llamafactory-cli = "llamafactory.cli:main"
lmf = "llamafactory.cli:main"

[tool.setuptools]
package-dir = {"" = "src_sspo"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src_sspo"]

[tool.ruff]
# Source remains syntactically compatible with the declared Python 3.10 lower bound.
target-version = "py310"
line-length = 119

[tool.ruff.lint]
ignore = ["C408", "C901", "E501", "E731", "E741", "W605"]
select = ["C", "E", "F", "I", "W"]
