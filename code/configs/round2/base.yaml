# Round2 defaults inherit the frozen model/data/training contract.
_base_: ../mvp/base.yaml

provenance:
  git_commit: null

model:
  name_or_path: null
  manifest_path: null
  max_seq_len: 2048
  torch_dtype: "bfloat16"
  enable_thinking: false
  use_cache: false
  gradient_checkpointing: true

training:
  lr: 0.00001
  learning_rate: 0.00001
  num_devices: 2
  global_batch_size: 64
  joint_labeled_global_batch_size: 8
  joint_unlabeled_global_batch_size: 56
  # One preference pair is materialized at a time.  Gradient accumulation
  # preserves the exact 8 labeled + 56 dynamic-pair optimizer population.
  backward_subbatch_size_per_device: 1
  gradient_accumulation_steps: 64
  # The inherited DDP microbatch fields do not describe TP execution.
  dpo_batch_size_per_device: null
  joint_labeled_batch_size_per_device: null
  joint_labeled_microsteps: null
  joint_unlabeled_microbatch_pattern: null
  save_steps: 1
  seed: 42
  distributed_backend: "transformers_tp"
  eval_max_samples: null
  smoke_objective_step: null

tensor_parallel:
  gpu_ids: "0,1"
  tensor_model_parallel_size: 2
  pipeline_model_parallel_size: 1
  data_parallel_size: 1
  micro_batch_size: 1
  sequence_parallel: false
  backend: "transformers-native-tp"
  require_tp_lora: true
  minimum_transformers_version: "5.4.0"
  minimum_peft_version: "0.19.0"
  minimum_torch_version: "2.7.0"

rollout:
  engine: "vllm"
  gpu_ids: "2"
  artifact_dir: null
  source: null
  sft_data_file: null
  tensor_parallel_size: 1
  max_model_len: 2048
  max_new_tokens: 512
  min_new_tokens: 0
  gpu_memory_utilization: 0.80
  max_num_seqs: 8
  enforce_eager: true
  minimum_vllm_version: "0.9.2"
  # Qwen3 official non-thinking sampling profile, preregistered for both arms.
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  sync_interval_steps: 1
  poll_interval_seconds: 1.0
  request_timeout_seconds: 3600

evaluation:
  gpu_id: "0"
  batch_size: 1
  score_type: "simpo_mean_logp_delta_margin_free"

output:
  run_dir: null
  refuse_overwrite: true
  save_checkpoints: true
