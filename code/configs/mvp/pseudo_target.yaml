# Pseudo-target: Instance-level hard pseudo labels
# Uses labeled + unlabeled with hard pseudo label baseline

# Inherit base config
_base_: base.yaml

# Method configuration
method:
  name: "pseudo_target"
  use_unlabeled: true
  lambda_pe: 0.5  # To be determined in stage 2 (lambda search)
  lambda_scheduler: "fixed"  # Options: fixed, linear_warmup, exp_warmup
  pseudo_threshold: 0.5

# Data: labeled + unlabeled
data:
  use_labeled: true
  use_unlabeled: true
  labeled_train_samples: 900
  labeled_val_samples: 100
  unlabeled_train_samples: 8000
