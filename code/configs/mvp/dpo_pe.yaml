# DPO+PE: Population-level label-encoding structure supervision
# Uses labeled + unlabeled with PE structure loss

# Inherit base config
_base_: base.yaml

# Method configuration
method:
  name: "dpo_pe"
  use_unlabeled: true
  lambda_pe: 0.5  # To be determined in stage 2 (lambda search)
  lambda_scheduler: "fixed"  # Options: fixed, linear_warmup, exp_warmup

  # PE-specific settings
  pe_distance: "l1"  # Options: l1, l2
  detach_denominator: false  # Emergency plan for training instability

# Data: labeled + unlabeled
data:
  use_labeled: true
  use_unlabeled: true
  labeled_train_samples: 900
  labeled_val_samples: 100
  unlabeled_train_samples: 8000
