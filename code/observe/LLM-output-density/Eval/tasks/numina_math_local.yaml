tag:
  - math_word_problems
task: numina_math_local
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: /root/autodl-tmp/prepared/NuminaMath-1___5/test.jsonl
output_type: generate_until
training_split: null
validation_split: null
test_split: test
doc_to_text: |
  Problem:
  {{problem}}

  Solve the problem. Put the final answer in \boxed{}.
  Answer:
doc_to_target: "{{answer}}"
process_results: !function numina_math_utils.process_results
generation_kwargs:
  max_gen_toks: 1024
  until:
    - "Problem:"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
repeats: 1
num_fewshot: 0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
