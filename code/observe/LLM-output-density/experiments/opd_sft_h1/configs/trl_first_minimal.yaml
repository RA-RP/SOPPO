experiment:
  name: trl_first_minimal
  output_root: /root/autodl-tmp/exp0609/trl_first_minimal
  seed: 42

model:
  base_model: /root/autodl-tmp/model/Qwen/Qwen3-1.7B
  cold_start_checkpoint:
  student_start_checkpoint:
  teacher_model: /root/autodl-tmp/model/Qwen/Qwen3-4B

data:
  prompt_jsonl: /root/autodl-tmp/prepared/NuminaMath-1___5/test.jsonl
  prompt_text_field: problem
  max_samples: 2

selection:
  selector_metric: GSM8K
  valid_gain_threshold_points: 2.0
  checkpoint_policy: latest_and_best_or_closest

eval:
  selector_tasks:
    - gsm8k
  full_eval_tasks:
    - gsm8k
    - hendrycks_math500
    - mmlu
    - winogrande
    - truthfulqa_mc1
    - truthfulqa_mc2

trl:
  lmbda: 1.0
  beta: 0.5
  loss_top_k: 1
  max_length: 4096
  max_completion_length: 512
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-5
  max_steps: 1
  save_steps: 25
  save_total_limit: 2
  logging_steps: 5
  gradient_checkpointing: false
  optim: adamw_torch
  bf16: true
  model_init_kwargs:
    torch_dtype: bfloat16
  teacher_model_init_kwargs:
    torch_dtype: bfloat16
  peft:
    enabled: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  use_vllm: false
  use_teacher_server: false
  teacher_model_server_url:
  report_to: []

registry:
  method: trl_opd_like
  role_label: TRL-OPD-lmbda-1.0
  pi_mix_lambda: 1.0
